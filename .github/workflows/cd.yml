name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Build app
        run: ./scripts/buildprod.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/38725140463/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: cloud-run-deployer@project-1fd345e7-c618-43a7-b49.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-1fd345e7-c618-43a7-b49

      - name: Build and push Docker image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/project-1fd345e7-c618-43a7-b49/notely-ar-repo/notely:latest .

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/project-1fd345e7-c618-43a7-b49/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project project-1fd345e7-c618-43a7-b49 --max-instances=4
